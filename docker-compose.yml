services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tutorly
      POSTGRES_USER: tutorly
      POSTGRES_PASSWORD: tutorly_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorly -d tutorly"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tutorly:tutorly_local@db:5432/tutorly
      SECRET_KEY: local-development-only-change-before-deploy
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api
volumes:
  postgres_data:
